<script type="text/javascript">
var crosswordClues = [];
var activeClueIndex = 0;
var crosswordSessionId = null;
var crosswordQuestionIds = [];
var crosswordBuildToken = 0;
var crosswordComplete = false;
var crosswordChecking = false;
var focusedGridCell = null;
var crosswordConfig = window.STEMCHEM_SUPABASE_CONFIG || {};
var crosswordSupabase = window.supabase && crosswordConfig.url && crosswordConfig.anonKey
    ? window.supabase.createClient(crosswordConfig.url, crosswordConfig.anonKey)
    : null;

window.onload = function(){
    var topicFilters = document.getElementById("topicFilters");
    for(var i = 0; i < TOPICS.length; i++){
        var label = document.createElement("label");
        label.className = "topic-option";
        var checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = TOPICS[i];
        checkbox.checked = true;
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(" " + TOPICS[i]));
        topicFilters.appendChild(label);
    }

    topicFilters.addEventListener("change", function(){
        updateWordLimit();
        buildCrossword();
    });
    document.getElementById("wordCount").addEventListener("change", buildCrossword);
    document.getElementById("checkAnswers").addEventListener("click", checkAnswers);
    document.getElementById("previousClue").addEventListener("click", function(){
        changeActiveClue(-1, true);
    });
    document.getElementById("nextClue").addEventListener("click", function(){
        changeActiveClue(1, true);
    });
    document.getElementById("newCrossword").addEventListener("click", function(){
        document.getElementById("crosswordResults").hidden = true;
        document.getElementById("gamePanel").hidden = false;
        buildCrossword();
    });
    document.getElementById("crossword").addEventListener("input", handleGridInput);
    document.getElementById("crossword").addEventListener("focusin", handleGridFocus);
    document.getElementById("crossword").addEventListener("keydown", handleGridKeydown);
    document.getElementById("mobileKeyboard").addEventListener("click", handleMobileKeyboard);
    createMobileKeyboard();
    updateWordLimit();
    buildCrossword();
};

function getSelectedTopics(){
    var checkboxes = document.querySelectorAll("#topicFilters input:checked");
    var selected = [];
    for(var i = 0; i < checkboxes.length; i++){
        selected.push(checkboxes[i].value);
    }
    return selected;
}

function getEntriesForSelectedTopics(){
    var selectedTopics = getSelectedTopics();
    return wordBank.filter(function(entry){
        return selectedTopics.indexOf(entry.topic) !== -1;
    });
}

function updateWordLimit(){
    var countInput = document.getElementById("wordCount");
    var available = getEntriesForSelectedTopics().length;
    var maxCount = Math.min(20, available);
    countInput.max = maxCount;

    if(available >= 2 && parseInt(countInput.value, 10) > maxCount){
        countInput.value = maxCount;
    } else if(available < 2){
        countInput.value = available;
    } else if(parseInt(countInput.value, 10) < 2){
        countInput.value = Math.min(10, available);
    }
}

function shuffledCopy(items){
    var copy = items.slice();
    for(var i = copy.length - 1; i > 0; i--){
        var j = Math.floor(Math.random() * (i + 1));
        var item = copy[i];
        copy[i] = copy[j];
        copy[j] = item;
    }
    return copy;
}

function normalizeAnswer(value){
    return String(value).toUpperCase().replace(/[^A-Z]/g, "");
}

function getClueOptions(entry){
    return Array.isArray(entry.clue) ? entry.clue.slice() : [entry.clue];
}

function buildCrossword(){
    crosswordBuildToken++;
    crosswordSessionId = null;
    crosswordQuestionIds = [];
    crosswordComplete = false;
    crosswordChecking = false;
    focusedGridCell = null;
    document.getElementById("checkAnswers").disabled = true;
    setPuzzleControlsDisabled(false);
    document.getElementById("answerFeedback").textContent = "";
    var selectedTopics = getSelectedTopics();
    var availableEntries = getEntriesForSelectedTopics();
    var countInput = document.getElementById("wordCount");
    var requestedCount = parseInt(countInput.value, 10);
    var status = document.getElementById("status");
    var crossword = document.getElementById("crossword");
    var answerFeedback = document.getElementById("answerFeedback");

    crossword.innerHTML = "";
    crosswordClues = [];
    activeClueIndex = 0;
    updateClueNavigator();
    answerFeedback.textContent = "";

    for(var i = 0; i < availableEntries.length; i++){
        var entry = availableEntries[i];
        var definitionClues = entry && (Array.isArray(entry.clue) ? entry.clue : [entry.clue]);
        var hasValidDefinitions = definitionClues && definitionClues.length > 0 &&
            definitionClues.every(function(clue){ return typeof clue === "string" && clue.trim(); });
        if(!entry || typeof entry.word !== "string" || !normalizeAnswer(entry.word) ||
            !hasValidDefinitions ||
            TOPICS.indexOf(entry.topic) === -1){
            status.setAttribute("role", "alert");
            status.textContent = "Word bank entry " + (i + 1) +
                " needs an answer with at least one letter, a valid clue, and a topic from the topic list.";
            return;
        }
    }

    if(selectedTopics.length === 0){
        status.setAttribute("role", "status");
        status.textContent = "Select at least one topic to build a crossword.";
        return;
    }

    if(availableEntries.length < 2){
        status.setAttribute("role", "status");
        status.textContent = "The selected topics need at least two word-bank entries.";
        return;
    }

    if(isNaN(requestedCount) || requestedCount < 2 || requestedCount > Math.min(20, availableEntries.length)){
        status.setAttribute("role", "alert");
        status.textContent = "Choose a word count from 2 to " + Math.min(20, availableEntries.length) + ".";
        return;
    }

    var entries = null;
    var cw = null;
    var grid = null;
    for(var attempt = 0; attempt < 20; attempt++){
        entries = shuffledCopy(availableEntries).slice(0, requestedCount);
        var words = entries.map(function(item){ return normalizeAnswer(item.word); });
        var clues = entries.map(function(item){
            var clueOptions = getClueOptions(item);
            return clueOptions[Math.floor(Math.random() * clueOptions.length)];
        });
        cw = new Crossword(words, clues);
        grid = cw.getSquareGrid(10);
        if(grid != null) break;
    }

    if(grid == null){
        status.setAttribute("role", "alert");
        status.textContent = "Could not fit " + requestedCount + " words into a crossword after several attempts. Try fewer words or different topics.";
        return;
    }

    status.setAttribute("role", "status");
    status.textContent = entries.length + " words from selected topics.";
    crossword.innerHTML = CrosswordUtils.toHtml(grid, false, true);
    var gridInputs = crossword.querySelectorAll(".crossword-letter");
    for(var inputIndex = 0; inputIndex < gridInputs.length; inputIndex++){
        gridInputs[inputIndex].setAttribute("inputmode", "none");
    }

    var legend = cw.getLegend(grid);
    for(var direction in legend){
        for(var j = 0; j < legend[direction].length; j++){
            var clue = legend[direction][j];
            clue.topic = entries[clue.index].topic;
        }
    }
    addLegendToPage(legend);
    startCrosswordSession(entries, crosswordBuildToken);
}

async function startCrosswordSession(entries, buildToken){
    var status = document.getElementById("status");
    try{
        if(!crosswordSupabase){
            throw new Error("Supabase is unavailable. You can check answers locally, but game XP cannot be saved.");
        }
        var sessionResult = await crosswordSupabase.auth.getSession();
        if(sessionResult.error) throw sessionResult.error;
        if(!sessionResult.data.session){
            document.getElementById("checkAnswers").disabled = false;
            status.textContent = "Crossword ready. Sign in to StemChem to save game rewards; answer checking remains available here.";
            return;
        }
        var result = await crosswordSupabase.functions.invoke("quiz", {
            body: {
                action: "start_crossword",
                entries: entries.map(function(entry){
                    return { topic: entry.topic, word: entry.word };
                })
            }
        });
        if(result.error) throw await readFunctionError(result.error);
        if(buildToken !== crosswordBuildToken) return;
        if(!result.data || !result.data.sessionId ||
            !Array.isArray(result.data.questions) ||
            result.data.questions.length !== entries.length){
            throw new Error("The crossword server returned an invalid game session.");
        }
        crosswordSessionId = result.data.sessionId;
        crosswordQuestionIds = result.data.questions.map(function(question){
            return question.id;
        });
        crosswordClues.forEach(function(clue){
            clue.questionId = crosswordQuestionIds[clue.index];
        });
        document.getElementById("checkAnswers").disabled = false;
        status.textContent = entries.length + " words from selected topics. This crossword is ready to earn game XP.";
    }catch(error){
        if(buildToken !== crosswordBuildToken) return;
        document.getElementById("checkAnswers").disabled = false;
        status.setAttribute("role", "alert");
        status.textContent = "A rewarded crossword could not be started: " +
            (error && error.message ? error.message : "Please try again.");
    }
}

function changeActiveClue(offset, focusGrid){
    if(crosswordClues.length === 0) return;
    activeClueIndex = (activeClueIndex + offset + crosswordClues.length) % crosswordClues.length;
    updateClueNavigator();
    if(focusGrid) focusActiveClue();
}

function findNextIncompleteClue(startIndex){
    for(var offset = 1; offset <= crosswordClues.length; offset++){
        var index = (startIndex + offset) % crosswordClues.length;
        var cells = Array.prototype.slice.call(getActiveClueCellsFor(crosswordClues[index]));
        if(cells.some(function(cell){ return !cell.value; })) return index;
    }
    return -1;
}

function createMobileKeyboard(){
    var keyboard = document.getElementById("mobileKeyboard");
    ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"].forEach(function(rowText){
        var row = document.createElement("div");
        row.className = "keyboard-row";
        for(var i = 0; i < rowText.length; i++){
            var key = document.createElement("button");
            key.type = "button";
            key.className = "keyboard-key";
            key.dataset.key = rowText.charAt(i);
            key.textContent = rowText.charAt(i);
            key.setAttribute("aria-label", "Enter " + rowText.charAt(i));
            row.appendChild(key);
        }
        keyboard.appendChild(row);
    });
    var deleteKey = document.createElement("button");
    deleteKey.type = "button";
    deleteKey.className = "keyboard-key keyboard-delete";
    deleteKey.dataset.key = "Backspace";
    deleteKey.textContent = "⌫";
    deleteKey.setAttribute("aria-label", "Delete letter");
    keyboard.lastElementChild.appendChild(deleteKey);
}

function handleMobileKeyboard(event){
    var key = event.target.closest("button[data-key]");
    if(!key || crosswordComplete || crosswordChecking) return;
    if(!focusedGridCell || !document.getElementById("crossword").contains(focusedGridCell)){
        focusedGridCell = document.activeElement.classList.contains("crossword-letter")
            ? document.activeElement
            : null;
    }
    if(!focusedGridCell) return;
    focusedGridCell.focus();
    if(key.dataset.key === "Backspace"){
        if(focusedGridCell.value){
            setGridLetter(focusedGridCell, "", false);
        }else{
            focusedGridCell.dispatchEvent(new KeyboardEvent("keydown", {
                key: "Backspace",
                bubbles: true
            }));
        }
        return;
    }
    setGridLetter(focusedGridCell, key.dataset.key, true);
}

function setPuzzleControlsDisabled(disabled){
    var controls = document.querySelectorAll("#topicFilters input, #wordCount, #mobileKeyboard button, .crossword-letter");
    for(var i = 0; i < controls.length; i++) controls[i].disabled = disabled;
}

function updateClueNavigator(){
    var clue = crosswordClues[activeClueIndex];
    var counter = document.getElementById("clueCounter");
    var text = document.getElementById("clueText");
    var details = document.getElementById("clueDetails");
    var previous = document.getElementById("previousClue");
    var next = document.getElementById("nextClue");

    if(!clue){
        counter.textContent = "No clues";
        text.textContent = "Build a crossword to get started.";
        details.textContent = "";
        previous.disabled = true;
        next.disabled = true;
        var cells = document.querySelectorAll(".crossword-letter.is-active-clue");
        for(var i = 0; i < cells.length; i++) cells[i].classList.remove("is-active-clue");
        return;
    }

    counter.textContent = "Clue " + (activeClueIndex + 1) + " of " + crosswordClues.length +
        " - " + clue.direction + " " + clue.position;
    text.textContent = clue.clue;
    details.textContent = clue.topic + " - " + clue.length + " letters";
    previous.disabled = false;
    next.disabled = false;

    var previousCells = document.querySelectorAll(".crossword-letter.is-active-clue");
    for(var j = 0; j < previousCells.length; j++) previousCells[j].classList.remove("is-active-clue");
    var activeCells = getActiveClueCells();
    for(var k = 0; k < activeCells.length; k++) activeCells[k].classList.add("is-active-clue");
}

function getActiveClueCells(){
    var clue = crosswordClues[activeClueIndex];
    if(!clue) return [];
    return document.querySelectorAll(
        ".crossword-letter[data-" + clue.direction + "-index='" + clue.index + "']"
    );
}

function focusActiveClue(){
    var cells = Array.prototype.slice.call(getActiveClueCells());
    var target = cells.find(function(cell){ return !cell.value; }) || cells[0];
    if(target){
        focusedGridCell = target;
        target.focus();
    }
}

function handleGridFocus(event){
    var cell = event.target;
    if(!cell.classList.contains("crossword-letter")) return;
    focusedGridCell = cell;

    var clue = crosswordClues[activeClueIndex];
    if(clue && cell.hasAttribute("data-" + clue.direction + "-index") &&
        cell.getAttribute("data-" + clue.direction + "-index") === String(clue.index)){
        return;
    }

    var direction = cell.hasAttribute("data-across-index") ? "across" : "down";
    var wordIndex = cell.getAttribute("data-" + direction + "-index");
    for(var i = 0; i < crosswordClues.length; i++){
        if(crosswordClues[i].direction === direction &&
            String(crosswordClues[i].index) === wordIndex){
            activeClueIndex = i;
            updateClueNavigator();
            return;
        }
    }
}

function handleGridInput(event){
    var cell = event.target;
    if(!cell.classList.contains("crossword-letter")) return;

    var letters = normalizeAnswer(cell.value);
    setGridLetter(cell, letters ? letters.charAt(letters.length - 1) : "", true);
}

function setGridLetter(cell, letter, advance){
    if(!cell || crosswordComplete || crosswordChecking) return;
    cell.value = letter;
    cell.classList.remove("is-correct", "is-incorrect");
    document.getElementById("answerFeedback").textContent = "";

    if(!cell.value) return;
    var clue = crosswordClues[activeClueIndex];
    if(!clue || !cell.hasAttribute("data-" + clue.direction + "-position")) return;
    if(advance === false) return;
    var clueCells = Array.prototype.slice.call(getActiveClueCells());
    clueCells.sort(function(left, right){
        return parseInt(left.getAttribute("data-" + clue.direction + "-position"), 10) -
            parseInt(right.getAttribute("data-" + clue.direction + "-position"), 10);
    });
    var currentIndex = clueCells.indexOf(cell);
    var nextCell = clueCells.slice(currentIndex + 1).concat(clueCells.slice(0, currentIndex))
        .find(function(candidate){ return !candidate.value; });
    if(nextCell){
        nextCell.focus();
        return;
    }
    if(clueCells.every(function(candidate){ return Boolean(candidate.value); })){
        var nextClueIndex = findNextIncompleteClue(activeClueIndex);
        if(nextClueIndex !== -1){
            activeClueIndex = nextClueIndex;
            updateClueNavigator();
            focusActiveClue();
        }else{
            document.getElementById("answerFeedback").textContent = "All words are filled. Check your answers when you are ready.";
            document.getElementById("checkAnswers").focus();
        }
    }
}

function handleGridKeydown(event){
    var cell = event.target;
    if(!cell.classList.contains("crossword-letter")) return;

    if(/^[a-z]$/i.test(event.key)){
        event.preventDefault();
        setGridLetter(cell, event.key.toUpperCase(), true);
        return;
    }

    if(event.key === "Backspace" && cell.value){
        event.preventDefault();
        setGridLetter(cell, "", false);
        return;
    }
    if(event.key !== "Backspace") return;

    var clue = crosswordClues[activeClueIndex];
    if(!clue || !cell.hasAttribute("data-" + clue.direction + "-position")) return;
    var position = parseInt(cell.getAttribute("data-" + clue.direction + "-position"), 10);
    if(position === 0) return;

    var clueCells = Array.prototype.slice.call(getActiveClueCells());
    clueCells.sort(function(left, right){
        return parseInt(left.getAttribute("data-" + clue.direction + "-position"), 10) -
            parseInt(right.getAttribute("data-" + clue.direction + "-position"), 10);
    });
    var currentIndex = clueCells.indexOf(cell);
    var previousCell = clueCells.slice(0, currentIndex).reverse()
        .find(function(candidate){ return Boolean(candidate.value); }) ||
        clueCells.slice(0, currentIndex).reverse()[0];
    if(previousCell){
        event.preventDefault();
        previousCell.focus();
        setGridLetter(previousCell, "", false);
        document.getElementById("answerFeedback").textContent = "";
    }
}

async function checkAnswers(){
    if(crosswordComplete || crosswordChecking) return;
    var cells = document.querySelectorAll(".crossword-letter");
    var incorrect = 0;
    var unanswered = 0;

    for(var i = 0; i < cells.length; i++){
        var cell = cells[i];
        if(!cell.value) unanswered++;
        var is_correct = normalizeAnswer(cell.value) === cell.getAttribute("data-answer");
        cell.classList.toggle("is-correct", is_correct);
        cell.classList.toggle("is-incorrect", !is_correct);
        if(!is_correct) incorrect++;
    }

    var feedback = document.getElementById("answerFeedback");
    if(unanswered){
        feedback.textContent = unanswered + " square" + (unanswered === 1 ? " is" : "s are") +
            " still empty. Fill every word before checking.";
        return;
    }
    feedback.textContent = incorrect === 0
        ? "All answers are correct!"
        : incorrect + " square" + (incorrect === 1 ? " is" : "s are") + " incorrect. Review the highlighted letters.";

    if(!crosswordSessionId){
        if(incorrect === 0){
            crosswordComplete = true;
            setPuzzleControlsDisabled(true);
            document.getElementById("checkAnswers").disabled = true;
            showCrosswordResults({ score: crosswordClues.length, total: crosswordClues.length, awardedXp: 0 }, false);
        }
        return;
    }

    var answers = {};
    for(var i = 0; i < crosswordClues.length; i++){
        var clue = crosswordClues[i];
        var clueCells = Array.prototype.slice.call(getActiveClueCellsFor(clue));
        clueCells.sort(function(left, right){
            return parseInt(left.getAttribute("data-" + clue.direction + "-position"), 10) -
                parseInt(right.getAttribute("data-" + clue.direction + "-position"), 10);
        });
        answers[clue.questionId] = clueCells.map(function(cell){ return cell.value; }).join("");
    }

    var sessionId = crosswordSessionId;
    var submitButton = document.getElementById("checkAnswers");
    crosswordChecking = true;
    submitButton.disabled = true;
    setPuzzleControlsDisabled(true);
    feedback.textContent += " Saving verified result…";
    try{
        var result = await crosswordSupabase.functions.invoke("quiz", {
            body: { action: "submit_crossword", sessionId: sessionId, answers: answers }
        });
        if(result.error) throw await readFunctionError(result.error);
        if(sessionId !== crosswordSessionId) return;
        if(!result.data || typeof result.data.score !== "number" ||
            typeof result.data.total !== "number" || !result.data.progress){
            throw new Error("The crossword server returned an invalid result.");
        }
        crosswordComplete = true;
        showCrosswordResults(result.data, true);
    }catch(error){
        crosswordChecking = false;
        setPuzzleControlsDisabled(false);
        feedback.textContent = "The result could not be saved: " +
            (error && error.message ? error.message : "Please try again.");
        submitButton.disabled = false;
    }
}

async function readFunctionError(error){
    if(error && error.context instanceof Response){
        try{
            var body = await error.context.clone().json();
            if(body && typeof body.error === "string") return new Error(body.error);
            if(body && typeof body.message === "string") return new Error(body.message);
        }catch(parseError){
            console.error("Could not read the crossword server error response.", parseError);
        }
    }
    return new Error(error && error.message ? error.message : "The crossword result could not be saved.");
}

function showCrosswordResults(result, rewarded){
    var results = document.getElementById("crosswordResults");
    var review = document.getElementById("crosswordReview");
    var multiplier = Number(result.multiplier || 1).toFixed(1);
    var xp = Number(result.awardedXp) || 0;
    document.getElementById("resultSummary").textContent =
        (rewarded ? "Server verified " : "You solved ") +
        result.score + " of " + result.total + " words." +
        (rewarded
            ? (xp > 0
                ? " You earned +" + xp + " XP at " + multiplier + "×."
                : " This result earned 0 XP; rewards are limited to five completed games and 100 game XP per day.")
            : " This local practice result was not saved for XP.");
    review.replaceChildren();
    crosswordClues.forEach(function(clue, index){
        var answerCells = Array.prototype.slice.call(getActiveClueCellsFor(clue));
        answerCells.sort(function(left, right){
            return parseInt(left.getAttribute("data-" + clue.direction + "-position"), 10) -
                parseInt(right.getAttribute("data-" + clue.direction + "-position"), 10);
        });
        var entered = answerCells.map(function(cell){ return cell.value; }).join("");
        var expected = answerCells.map(function(cell){ return cell.getAttribute("data-answer"); }).join("");
        var item = document.createElement("article");
        item.className = "crossword-review-item " +
            (normalizeAnswer(entered) === normalizeAnswer(expected) ? "is-correct" : "is-incorrect");
        var title = document.createElement("h3");
        title.textContent = (index + 1) + ". " + clue.topic + " · " + clue.direction;
        var prompt = document.createElement("p");
        prompt.textContent = clue.clue;
        var answer = document.createElement("p");
        answer.className = "crossword-review-answer";
        answer.textContent = "Your answer: " + entered + " · Correct answer: " + expected;
        item.append(title, prompt, answer);
        review.appendChild(item);
    });
    document.getElementById("gamePanel").hidden = true;
    results.hidden = false;
    results.focus();
}

function getActiveClueCellsFor(clue){
    return document.querySelectorAll(
        ".crossword-letter[data-" + clue.direction + "-index='" + clue.index + "']"
    );
}

function addLegendToPage(groups){
    crosswordClues = [];
    for(var k in groups){
        for(var i = 0; i < groups[k].length; i++){
            var clue = groups[k][i];
            crosswordClues.push({
                direction: k,
                index: clue.index,
                position: clue.position,
                clue: clue.clue,
                topic: clue.topic,
                length: normalizeAnswer(clue.word).length,
                questionId: crosswordQuestionIds[clue.index]
            });
        }
    }
    activeClueIndex = 0;
    updateClueNavigator();
    focusActiveClue();
}
</script>

<body>
    <main>
        <a class="back-link" href="../index.html">← Back to StemChem</a>
        <h1>Chemistry Crossword</h1>
        <div class="theme-options" role="group" aria-label="Color theme">
            <button class="theme-option" type="button" data-theme-choice="light" aria-pressed="false">Light</button>
            <button class="theme-option" type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
            <button class="theme-option" type="button" data-theme-choice="system" aria-pressed="false">System</button>
        </div>
        <section id="gamePanel" aria-label="Crossword game">
            <fieldset class="word-bank-controls">
                <legend>Choose topics</legend>
                <div id="topicFilters"></div>
            </fieldset>
            <div class="word-count-control">
                <label for="wordCount">Words in crossword</label>
                <input id="wordCount" type="number" min="2" value="10" />
            </div>
            <p id="status" aria-live="polite" role="status"></p>
            <div id="crossword"></div>
            <div id="mobileKeyboard" class="mobile-keyboard" aria-label="Crossword letter keyboard"></div>
            <button id="checkAnswers" type="button">Check answers</button>
            <p id="answerFeedback" aria-live="polite"></p>
            <section id="clueNavigator" aria-label="Current crossword clue">
                <button id="previousClue" class="clue-arrow" type="button" aria-label="Previous clue">&larr;</button>
                <div class="clue-content" aria-live="polite">
                    <p id="clueCounter"></p>
                    <p id="clueText"></p>
                    <p id="clueDetails"></p>
                </div>
                <button id="nextClue" class="clue-arrow" type="button" aria-label="Next clue">&rarr;</button>
            </section>
        </section>
        <section id="crosswordResults" class="crossword-results" aria-labelledby="resultsTitle" tabindex="-1" hidden>
            <p class="result-eyebrow">CROSSWORD COMPLETE</p>
            <h2 id="resultsTitle">Your results</h2>
            <p id="resultSummary" aria-live="polite"></p>
            <h3>Answer review</h3>
            <div id="crosswordReview" class="crossword-review"></div>
            <button id="newCrossword" type="button">Build another crossword</button>
        </section>
    </main>

</body>
</html>
